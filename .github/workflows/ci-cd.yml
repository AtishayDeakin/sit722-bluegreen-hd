# CI/CD pipeline: zero-downtime blue/green releases with automated rollback.
#
# Extends the Week 7 CI pipeline (test -> build -> push) with the delivery half:
#
#   1. CI (GitHub-hosted)  backend + frontend tests, controller unit tests,
#                          Terraform and Kubernetes manifest validation
#   2. Build (GitHub)      multi-arch images (amd64 + arm64) pushed to GHCR
#   3. Provision (local)   Terraform plan/apply of the Kubernetes platform
#   4. Deploy (local)      stage on the idle colour -> smoke test -> switch
#                          traffic -> watch Prometheus -> promote or roll back
#
# Stages 3-4 run on a self-hosted runner on the machine that hosts the
# Docker Desktop Kubernetes cluster (label: koalatech-k8s).
#
# Fault injection for demonstrations (Actions -> Run workflow):
#   fault_rate=1.0, start=0    release is blocked by the smoke tests
#   fault_rate=0.5, start=120  release passes smoke tests, then fails after
#                              the swap and is rolled back automatically

name: CI/CD - Blue/Green Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      fault_rate:
        description: "Fault injection: share of API requests the NEW release fails (0 = off, 0.5 = half, 1.0 = all)"
        type: string
        default: "0"
      fault_start_after_seconds:
        description: "Seconds after start-up before faults begin (0 = immediately, 120 = slips past smoke tests)"
        type: string
        default: "0"
      observe_seconds:
        description: "How long to watch production after switching traffic"
        type: string
        default: "150"

permissions:
  contents: read

# Releases to the one production environment must never overlap.
# Pull requests only run CI, so they get their own group.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-{0}', github.ref) || 'koalatech-production' }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  # =========================================================================
  # 1. Continuous Integration
  # =========================================================================
  backend-test:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            database: users
            port: 5433
          - service: student-service
            database: students
            port: 5434
          - service: lecturer-service
            database: lecturers
            port: 5435
          - service: course-service
            database: courses
            port: 5436
          - service: enrollment-service
            database: enrollments
            port: 5437

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ matrix.database }}
        ports:
          - ${{ matrix.port }}:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ${{ matrix.database }}"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ${{ matrix.database }}
      POSTGRES_HOST: localhost
      POSTGRES_PORT: ${{ matrix.port }}
      JWT_SECRET_KEY: koalatech-ci-test-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_EMAIL: admin@koalatech.edu.au
      DEFAULT_ADMIN_PASSWORD: AdminPassword123!
      AZURE_STORAGE_CONNECTION_STRING: ""
      AZURE_STORAGE_CONTAINER_NAME: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests (API + observability hooks)
        working-directory: ${{ matrix.service }}
        run: pytest -v

  frontend-test:
    name: Test frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and test
        working-directory: frontend
        env:
          VITE_USER_SERVICE_URL: http://localhost:8000
          VITE_STUDENT_SERVICE_URL: http://localhost:8000
          VITE_LECTURER_SERVICE_URL: http://localhost:8000
          VITE_COURSE_SERVICE_URL: http://localhost:8000
          VITE_ENROLLMENT_SERVICE_URL: http://localhost:8000
        run: |
          npm ci
          npm run test:run

  pipeline-test:
    name: Test deployment tooling and IaC
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Unit test the blue/green controller
        run: python -m unittest discover -s deploy/tests -v

      - name: Check the smoke test and load test scripts parse
        run: |
          python -m py_compile tests/smoke/smoke_test.py
          bash -n scripts/ci/loadtest.sh

      - name: Validate rendered Kubernetes manifests (kubeconform, strict)
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          python - <<'PY'
          import sys
          sys.path.insert(0, "deploy")
          import bluegreen as bg
          for colour in bg.COLOURS:
              manifest = bg.render_release(colour, "0123456789abcdef", "ghcr.io/example", 2, 0.5, 90)
              open(f"release-{colour}.yaml", "w").write(manifest)
          PY
          ./kubeconform -strict -summary release-blue.yaml release-green.yaml

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform format and validate
        working-directory: infra/platform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # =========================================================================
  # 2. Build and publish images (only after every test has passed)
  # =========================================================================
  build-and-push:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test, pipeline-test]
    if: github.event_name != 'pull_request'

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        include:
          - service: frontend
            image: koalatech-frontend
          - service: user-service
            image: koalatech-user-service
          - service: student-service
            image: koalatech-student-service
          - service: lecturer-service
            image: koalatech-lecturer-service
          - service: course-service
            image: koalatech-course-service
          - service: enrollment-service
            image: koalatech-enrollment-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Registry name (GHCR needs lower case)
        run: echo "REGISTRY=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Set up QEMU (to build arm64 on an amd64 runner)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # =========================================================================
  # 3. Provision / reconcile the platform with Terraform
  # =========================================================================
  provision:
    name: Provision platform (Terraform)
    runs-on: [self-hosted, koalatech-k8s]
    needs: [backend-test, frontend-test, pipeline-test]
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Terraform init (state kept outside the workspace)
        working-directory: infra/platform
        run: |
          mkdir -p "$HOME/.koalatech"
          terraform init -input=false -backend-config="path=$HOME/.koalatech/terraform.tfstate"

      - name: Terraform plan (drift check)
        id: plan
        working-directory: infra/platform
        run: |
          set +e
          terraform plan -input=false -detailed-exitcode -out=tfplan
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then exit 1; fi
          if [ "$code" -eq 2 ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "### Terraform: changes found, applying" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "### Terraform: no drift, platform matches Git" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Terraform apply
        if: steps.plan.outputs.changes == 'true'
        working-directory: infra/platform
        run: terraform apply -input=false tfplan

  # =========================================================================
  # 4. Blue/green release with automated rollback
  # =========================================================================
  deploy:
    name: Blue/green release
    runs-on: [self-hosted, koalatech-k8s]
    needs: [build-and-push, provision]
    timeout-minutes: 30

    environment:
      name: production
      url: http://localhost:8080

    permissions:
      contents: read
      packages: read

    env:
      VERSION: ${{ github.sha }}
      FAULT_RATE: ${{ inputs.fault_rate || '0' }}
      FAULT_DELAY: ${{ inputs.fault_start_after_seconds || '0' }}
      OBSERVE_SECONDS: ${{ inputs.observe_seconds || '150' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Preflight (cluster, platform and Prometheus reachable)
        run: python3 deploy/bluegreen.py preflight

      - name: Image pull credentials for GHCR
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: python3 deploy/bluegreen.py registry-secret

      - name: Plan release (which colour is live, which is idle)
        id: plan
        run: python3 deploy/bluegreen.py plan

      - name: Deploy release to idle colour (${{ steps.plan.outputs.target_color }})
        id: deploy
        run: |
          REGISTRY="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          python3 deploy/bluegreen.py deploy \
            --color "${{ steps.plan.outputs.target_color }}" \
            --version "$VERSION" \
            --registry "$REGISTRY" \
            --fault-rate "$FAULT_RATE" \
            --fault-delay "$FAULT_DELAY"

      - name: Smoke test the idle colour through the preview endpoint
        id: smoke
        run: |
          ADMIN_PASSWORD="$(python3 deploy/bluegreen.py admin-password)"
          echo "::add-mask::$ADMIN_PASSWORD"
          SMOKE_ADMIN_PASSWORD="$ADMIN_PASSWORD" python3 tests/smoke/smoke_test.py \
            --base-url http://localhost:8081 \
            --expect-color "${{ steps.plan.outputs.target_color }}" \
            --expect-version "$VERSION"

      - name: Start load test against production (k6)
        id: load
        run: |
          ADMIN_PASSWORD="$(python3 deploy/bluegreen.py admin-password)"
          echo "::add-mask::$ADMIN_PASSWORD"
          export ADMIN_PASSWORD
          scripts/ci/loadtest.sh start "$(( OBSERVE_SECONDS + 45 ))"
          echo "Measuring the current release for 20s before the switch..."
          sleep 20

      - name: Switch production traffic to ${{ steps.plan.outputs.target_color }}
        id: swap
        run: |
          python3 deploy/bluegreen.py swap \
            --to "${{ steps.plan.outputs.target_color }}" \
            --version "$VERSION"

      - name: Watch production (Prometheus health gate)
        id: observe
        run: |
          python3 deploy/bluegreen.py observe \
            --color "${{ steps.plan.outputs.target_color }}" \
            --duration "$OBSERVE_SECONDS"

      - name: Collect load-test results
        id: k6
        if: success()
        run: scripts/ci/loadtest.sh finish

      - name: Verify zero downtime (no failed connections during the switch)
        if: success()
        run: |
          errors="${{ steps.k6.outputs.transport_errors }}"
          if [ -z "$errors" ]; then echo "No load-test result found."; exit 1; fi
          if [ "$errors" -ne 0 ]; then
            echo "$errors request(s) could not connect during the release."
            exit 1
          fi
          echo "Zero downtime confirmed: no request failed to connect."

      # ---- Failure paths ------------------------------------------------
      - name: AUTOMATIC ROLLBACK to ${{ steps.plan.outputs.live_color }}
        if: failure() && steps.swap.outcome == 'success'
        run: |
          python3 deploy/bluegreen.py rollback \
            --from "${{ steps.plan.outputs.target_color }}" \
            --to "${{ steps.plan.outputs.live_color }}" \
            --reason "${{ steps.observe.outputs.reason || 'a check after the traffic switch failed' }}"

      - name: Abort release (production was never switched)
        if: failure() && steps.swap.outcome != 'success' && steps.plan.outcome == 'success'
        run: python3 deploy/bluegreen.py abort --color "${{ steps.plan.outputs.target_color }}"

      - name: Collect load-test results after the rollback
        if: failure() && steps.load.outcome == 'success'
        run: scripts/ci/loadtest.sh stop

      # ---- Success path -------------------------------------------------
      - name: Promote release and retire the old colour
        if: success()
        run: |
          python3 deploy/bluegreen.py finalize \
            --live "${{ steps.plan.outputs.target_color }}" \
            --retire "${{ steps.plan.outputs.live_color }}"

      # ---- Always -------------------------------------------------------
      - name: Final state of both colours
        if: always()
        run: python3 deploy/bluegreen.py status

      - name: Upload load-test report
        if: always() && steps.load.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: k6-report-${{ github.run_id }}
          path: ${{ runner.temp }}/k6/k6-summary.json
          if-no-files-found: ignore

      - name: Clean up load-test container
        if: always()
        run: scripts/ci/loadtest.sh cleanup
